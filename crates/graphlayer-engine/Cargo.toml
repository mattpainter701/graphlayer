[package]
name = "graphlayer-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
regex = "1"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3.0.1"
smb2 = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }

[dev-dependencies]
flate2 = "1"
