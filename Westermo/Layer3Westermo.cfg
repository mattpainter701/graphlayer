# \\/ Westermo WeOS v4.31.0, CLI Format v1.31
# Lynx L210-F2G, art.no. 3643-0105 ser.no. 1850

aaa
	username admin hash XXXXXXXX
	end

system
	hostname MainPLC
	location "XXXXXX"
	timezone America/Chicago
	end

alarm
	action 1
		target snmp log led digout 
		end
	end

port 1-2
	auto-neg-capability 10-half,10-full,100-half,100-full,1000-half,1000-full
	speed-duplex auto
	end
port 3-10
	speed-duplex auto
	end

frnt 1
	version 0
	focal-point
	ring-ports 1, 2
	end

no spanning-tree

vlan 1
	name vlan1
	end

vlan 2
	name PLC
	untagged 3,5,7,9
	tagged 1-2
	end

vlan 3
	name HMI
	untagged 4,6,8
	tagged 1-2
	end

vlan 13
	name Management
	untagged 1-2,10
	end

iface vlan1 inet dhcp
	address 192.168.2.200/24 secondary
	no enable
	distance 1
	primary
	management ssh http https ipconfig snmp 
	option 1,3,6,7,12,15,42,121,249
	end

iface vlan2 inet static
	distance 16
	management ssh http https ipconfig snmp 
	address 192.168.2.254/24
	end

iface vlan3 inet static
	distance 16
	management ssh http https ipconfig snmp 
	address 192.168.3.254/24
	end

iface vlan13 inet static
	distance 1
	management ssh http https ipconfig snmp 
	address 192.168.13.254/24
	end

ip
	multicast-flood-unknown ALL
	firewall
		policy input DROP
		policy forward DROP
		filter allow in vlan2 proto icmp
		filter allow in vlan3 proto icmp
		filter allow in vlan13 proto icmp
		filter allow in vlan2 out vlan13 src 192.168.2.0/24 dst 192.168.13.0/24
		filter allow in vlan13 out vlan2 src 192.168.13.0/24 dst 192.168.2.0/24
		filter allow in vlan2 out vlan3 src 192.168.2.0/24 dst 192.168.3.0/24
		filter allow in vlan3 out vlan2 src 192.168.3.0/24 dst 192.168.2.0/24
		filter allow in vlan3 out vlan13 src 192.168.3.0/24 dst 192.168.13.0/24
		filter allow in vlan13 out vlan3 src 192.168.13.0/24 dst 192.168.3.0/24
		enable
		end
	end

snmp-server
	rocommunity public
	no rwcommunity
	trapcommunity trap
	end

ntp
	no enable
	server pool.ntp.org
		end
	end

logging
	secure-mode
	end

