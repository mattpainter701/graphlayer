name: Rust migration reference capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  rust-tooling-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve new Rust dependencies on hosted runner
        run: cargo generate-lockfile
      - name: Format in hosted workspace
        continue-on-error: true
        run: cargo fmt --all
      - name: Compile ports for diagnostics
        continue-on-error: true
        run: cargo check --workspace --all-targets
      - name: Compare every released contract
        continue-on-error: true
        run: cargo test --test released_investigation -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-migration-tooling
          path: |
            Cargo.lock
            crates/graphlayer-engine/src/
            crates/graphlayer-engine/tests/
            crates/graphlayer-engine/released-parity-failures.json
