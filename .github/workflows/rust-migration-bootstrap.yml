name: Rust migration reference capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  rust-tooling-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve new Rust dependencies on hosted runner
        run: cargo generate-lockfile
      - uses: actions/cache/restore@v4
        id: rust-debug-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-debug-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format in hosted workspace
        run: cargo fmt --all
      - name: Compile ports for diagnostics
        if: always()
        run: cargo check --workspace --all-targets
      - name: Compare every released contract
        if: always()
        run: cargo test --test released_investigation -- --nocapture
      - name: Collect strict compiler diagnostics
        if: always()
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-migration-tooling
          path: |
            Cargo.lock
            crates/graphlayer-engine/src/
            crates/graphlayer-engine/tests/
            crates/graphlayer-engine/released-parity-failures.json
      - uses: actions/cache/save@v4
        if: always() && steps.rust-debug-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-debug-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
