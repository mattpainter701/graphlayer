name: Rust migration reference capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  released-v7-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 418e550f173938bad7dc7d86995d4a12945f9f23
          path: .released
      - uses: actions/setup-go@v5
        with:
          go-version-file: .released/platform/go.mod
      - name: Build exact released worker
        working-directory: .released
        run: |
          cargo build --locked --release --package graphlayer-engine
          echo "GRAPHLAYER_ENGINE=$PWD/target/release/graphlayer-engine" >> "$GITHUB_ENV"
      - name: Capture released workspace with every investigation kind
        env:
          RELEASE_WORKSPACE_OUTPUT: ${{ github.workspace }}/released-workspace-v7
        run: |
          cp e2e/capture-release/workspace_v7.go.txt .released/platform/investigation/rust_migration_capture_test.go
          cd .released/platform
          go test ./investigation -run '^TestCaptureReleasedV7Workspace$' -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: released-workspace-v7
          path: released-workspace-v7/*.json

  rust-tooling-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve new Rust dependencies on hosted runner
        run: cargo generate-lockfile
      - uses: actions/cache/restore@v4
        id: rust-debug-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-debug-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format in hosted workspace
        run: cargo fmt --all
      - name: Compile ports for diagnostics
        if: always()
        run: cargo check --workspace --all-targets
      - name: Compare every released contract
        if: always()
        run: cargo test --test released_investigation -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-migration-tooling
          path: |
            Cargo.lock
            crates/graphlayer-engine/src/
            crates/graphlayer-engine/tests/
            crates/graphlayer-engine/released-parity-failures.json
      - uses: actions/cache/save@v4
        if: always() && steps.rust-debug-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-debug-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
