name: Rust migration reference capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  released-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 418e550f173938bad7dc7d86995d4a12945f9f23
          path: .released
      - uses: actions/setup-go@v5
        with:
          go-version-file: .released/platform/go.mod
      - name: Build exact released forwarding worker
        working-directory: .released
        run: |
          cargo build --locked --release --package graphlayer-engine
          echo "GRAPHLAYER_ENGINE=$PWD/target/release/graphlayer-engine" >> "$GITHUB_ENV"
      - name: Instrument isolated released public entry points
        run: |
          go run ./e2e/capture-release/main.go --root "$PWD/.released"
          mkdir -p released-contracts
      - name: Capture released parser and investigation contracts
        working-directory: .released/platform
        env:
          RELEASE_CAPTURE_DIR: ${{ github.workspace }}/released-contracts
        run: go test ./firewall ./policy ./pathanalysis ./networkpath ./investigation ./cmd/graphlayer-investigate -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-investigation-contracts
          path: released-contracts/
          if-no-files-found: error

  rust-tooling-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve new Rust dependencies on hosted runner
        run: cargo generate-lockfile
      - name: Format in hosted workspace
        run: cargo fmt --all
      - name: Compile ports for diagnostics
        continue-on-error: true
        run: cargo check --workspace --all-targets
      - name: Compare every released contract
        continue-on-error: true
        run: cargo test --test released_investigation -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-migration-tooling
          path: |
            Cargo.lock
            crates/graphlayer-engine/src/
            crates/graphlayer-engine/tests/
            crates/graphlayer-engine/released-parity-failures.json
