name: QA Docker Stack

on:
  push:
    branches: [main, codex/repository-privacy]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-graphlayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate QA compose file
        run: docker compose -f docker-compose.qa.yml config

      - name: Build and run QA container
        run: docker compose -f docker-compose.qa.yml up --build --abort-on-container-exit --exit-code-from qa-graphlayer

      - name: Tear down QA stack
        if: always()
        run: docker compose -f docker-compose.qa.yml down -v --remove-orphans
