name: Performance Benchmarks

on:
  push:
    branches: [main, codex/repository-privacy, codex/windows-worker-release-recovery]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy' || github.ref == 'refs/heads/codex/windows-worker-release-recovery') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Run benchmarks
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -bench=. -benchmem -benchtime=3s \
            -run='^$' ./correlation/... ./scoring/... ./graph/... ./intelligence/... \
            | tee bench.txt

      - name: Upload benchmark results
        uses: ./.github/actions/archive-ci-artifact
        with:
          name: benchmarks
          path: platform/bench.txt
