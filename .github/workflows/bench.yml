name: Performance Benchmarks

on:
  push:
    branches: [main, codex/repository-privacy]
  pull_request:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: Run benchmarks
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -bench=. -benchmem -benchtime=3s \
            -run='^$' ./correlation/... ./scoring/... ./graph/... ./intelligence/... \
            | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: platform/bench.txt
