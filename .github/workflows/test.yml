name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - uses: ./.github/actions/build-rust-engine

      - name: Run tests with coverage
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -coverprofile=coverage.out -coverpkg=./correlation/...,./comparison/...,./graph/...,./intelligence/...,./scoring/...,./vendors/shared/...,./models/...,./reference/iana/...,./policy/...,./cmd/graphlayer-policy/...,./vendors/cisco/asa/...,./firewall/...,./investigation/...,./cmd/graphlayer-investigate/...,./pathanalysis/...,./networkpath/... \
            ./correlation/... ./comparison/... ./graph/... \
            ./intelligence/... ./scoring/... ./vendors/shared/... \
            ./models/... ./reference/iana/... ./policy/... ./cmd/graphlayer-policy/... \
            ./vendors/cisco/asa/... ./firewall/... ./investigation/... ./cmd/graphlayer-investigate/... ./pathanalysis/... ./networkpath/... ./rustengine/...

      - name: Check policy and investigation concurrency
        working-directory: platform
        run: go test -race ./policy ./firewall ./investigation ./pathanalysis ./networkpath ./rustengine

      - name: Coverage threshold check
        run: |
          cd platform
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COV}%"
          if (( $(echo "$COV < 70.0" | bc -l) )); then
            echo "Coverage ${COV}% below 70% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: platform/coverage.out

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/build-rust-engine

      - name: Run Python connector tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -v

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/build-rust-engine

      - name: Install pinned browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run native firewall and mixed-vendor browser workflows
        # These imports use the same required Rust parser worker as production.
        run: npm run test:e2e

      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firewall-investigation-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  connector-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
      - uses: ./.github/actions/build-rust-engine
      - name: Test Rust-backed Go connector compatibility
        working-directory: platform/orchestration
        run: go test -race -timeout 3m ./connectors/...

  connector-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRAPHLAYER_TEST_SSH_HOST: 127.0.0.1
      SSH_PORT: 2222
      SMB_HOST: 127.0.0.1
      GRAPHLAYER_TEST_USERNAME: netfixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/build-rust-engine
      - name: Generate ephemeral service credentials
        run: |
          python - <<'PY'
          import os, secrets
          password = secrets.token_urlsafe(32)
          print("::add-mask::" + password)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GRAPHLAYER_TEST_PASSWORD=" + password + "\n")
          PY
      - name: Build and start isolated acquisition services
        run: |
          docker build --file e2e/connector-services/Dockerfile --tag graphlayer-connector-fixture .
          docker run --detach --name graphlayer-connector-fixture --publish 127.0.0.1:2222:22 --publish 127.0.0.1:445:445 --env GRAPHLAYER_TEST_PASSWORD graphlayer-connector-fixture
          python - <<'PY'
          import os, pathlib, socket, subprocess, time
          deadline = time.monotonic() + 60
          for port in (2222, 445):
              while True:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise RuntimeError("Connector service did not become ready") from None
                      time.sleep(0.25)
          while True:
              try:
                  public = subprocess.check_output(["docker", "exec", "graphlayer-connector-fixture", "cat", "/etc/ssh/ssh_host_ed25519_key.pub"], stderr=subprocess.DEVNULL, text=True)
                  break
              except subprocess.CalledProcessError:
                  if time.monotonic() >= deadline:
                      raise RuntimeError("Fixture host key is unavailable") from None
                  time.sleep(0.25)
          known = pathlib.Path(os.environ["RUNNER_TEMP"]) / "connector-known-hosts"
          known.write_text("[127.0.0.1]:2222 " + " ".join(public.split()[:2]) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GRAPHLAYER_TEST_KNOWN_HOSTS=" + str(known) + "\n")
          PY
      - name: Start real investigation application
        run: |
          go -C platform build -trimpath -o "$RUNNER_TEMP/graphlayer-investigate" ./cmd/graphlayer-investigate
          "$RUNNER_TEMP/graphlayer-investigate" --listen 127.0.0.1:8091 --data-dir "$RUNNER_TEMP/acquisition-workspace" > "$RUNNER_TEMP/acquisition-app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/acquisition-app.pid"
      - name: Acquire SFTP and SMB configurations and investigate with source evidence
        run: python e2e/connector-acquisition.py
      - name: Stop fixture processes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/acquisition-app.pid" ]; then kill "$(cat "$RUNNER_TEMP/acquisition-app.pid")" || true; fi
          docker rm --force graphlayer-connector-fixture || true

  windows-native-go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - uses: ./.github/actions/build-rust-engine

      - name: Test native Rust filesystem and worker contracts
        run: cargo test --locked --release --workspace --lib --bins

      - name: Test native vendor parsers and investigation storage
        working-directory: platform
        run: go test ./vendors/cisco/asa ./firewall ./policy ./investigation ./cmd/graphlayer-investigate ./pathanalysis ./networkpath ./rustengine

      - name: Package native Windows application and required Rust engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native-bundle | Out-Null
          go -C platform build -trimpath -o ../native-bundle/graphlayer-investigate.exe ./cmd/graphlayer-investigate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $env:GRAPHLAYER_ENGINE -Destination native-bundle/graphlayer-engine.exe
          Get-ChildItem -LiteralPath native-bundle -Filter '*.exe' | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -LiteralPath native-bundle/SHA256SUMS -Encoding utf8
      - name: Upload native Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: graphlayer-investigate-windows-amd64
          path: native-bundle/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test packaged Windows application and sibling Rust worker
        shell: pwsh
        run: |
          $env:GRAPHLAYER_ENGINE = $null
          $smokeData = Join-Path $env:RUNNER_TEMP 'graphlayer-native-smoke'
          $smokeOut = Join-Path $env:RUNNER_TEMP 'graphlayer-native-smoke.stdout'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'graphlayer-native-smoke.stderr'
          $smokeApp = (Resolve-Path 'native-bundle/graphlayer-investigate.exe').Path
          $smokeProcess = Start-Process -FilePath $smokeApp -ArgumentList @('--listen', '127.0.0.1:8091', '--data-dir', ('"{0}"' -f $smokeData)) -WindowStyle Hidden -PassThru -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          try {
            python e2e/container-smoke.py
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application smoke test failed' }
          } finally {
            if (-not $smokeProcess.HasExited) { Stop-Process -Id $smokeProcess.Id -ErrorAction SilentlyContinue }
          }
