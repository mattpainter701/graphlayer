name: Test & Coverage

on:
  push:
    branches: [main, codex/repository-privacy, codex/windows-worker-release-recovery]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy' || github.ref == 'refs/heads/codex/windows-worker-release-recovery') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - uses: ./.github/actions/build-rust-engine

      - name: Run tests with coverage
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -coverprofile=coverage.out -coverpkg=./correlation/...,./comparison/...,./graph/...,./intelligence/...,./scoring/...,./vendors/shared/...,./models/...,./reference/iana/...,./policy/...,./cmd/graphlayer-policy/...,./vendors/cisco/asa/...,./firewall/...,./investigation/...,./cmd/graphlayer-investigate/...,./pathanalysis/...,./networkpath/... \
            ./correlation/... ./comparison/... ./graph/... \
            ./intelligence/... ./scoring/... ./vendors/shared/... \
            ./models/... ./reference/iana/... ./policy/... ./cmd/graphlayer-policy/... \
            ./vendors/cisco/asa/... ./firewall/... ./investigation/... ./cmd/graphlayer-investigate/... ./pathanalysis/... ./networkpath/... ./rustengine/...

      - name: Check policy and investigation concurrency
        working-directory: platform
        run: go test -race ./policy ./firewall ./investigation ./pathanalysis ./networkpath ./rustengine

      - name: Coverage threshold check
        run: |
          cd platform
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COV}%"
          if (( $(echo "$COV < 70.0" | bc -l) )); then
            echo "Coverage ${COV}% below 70% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: ./.github/actions/archive-ci-artifact
        with:
          name: coverage
          path: platform/coverage.out

  python-test:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy' || github.ref == 'refs/heads/codex/windows-worker-release-recovery') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/build-rust-engine

      - name: Run Python connector tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -v

  browser-e2e:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy' || github.ref == 'refs/heads/codex/windows-worker-release-recovery') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}

      - uses: ./.github/actions/build-rust-engine

      - name: Install pinned browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run native firewall and mixed-vendor browser workflows
        # These imports use the same required Rust parser worker as production.
        run: npm run test:e2e

      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: ./.github/actions/archive-ci-artifact
        with:
          name: firewall-investigation-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  connector-go:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy' || github.ref == 'refs/heads/codex/windows-worker-release-recovery') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/build-rust-engine
      - name: Test Rust-backed Go connector compatibility
        working-directory: platform/orchestration
        run: go test -race -timeout 3m ./connectors/...

  connector-e2e:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy' || github.ref == 'refs/heads/codex/windows-worker-release-recovery') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      GRAPHLAYER_TEST_SSH_HOST: 127.0.0.1
      SSH_PORT: 2222
      SMB_HOST: 127.0.0.1
      GRAPHLAYER_TEST_USERNAME: netfixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/build-rust-engine
      - name: Generate ephemeral service credentials
        run: |
          python - <<'PY'
          import os, secrets
          password = secrets.token_urlsafe(32)
          print("::add-mask::" + password)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GRAPHLAYER_TEST_PASSWORD=" + password + "\n")
          PY
      - name: Build and start isolated acquisition services
        run: |
          docker build --file e2e/connector-services/Dockerfile --tag graphlayer-connector-fixture .
          docker run --detach --name graphlayer-connector-fixture --publish 127.0.0.1:2222:22 --publish 127.0.0.1:445:445 --env GRAPHLAYER_TEST_PASSWORD graphlayer-connector-fixture
          python - <<'PY'
          import os, pathlib, socket, subprocess, time
          deadline = time.monotonic() + 60
          for port in (2222, 445):
              while True:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise RuntimeError("Connector service did not become ready") from None
                      time.sleep(0.25)
          while True:
              try:
                  public = subprocess.check_output(["docker", "exec", "graphlayer-connector-fixture", "cat", "/etc/ssh/ssh_host_ed25519_key.pub"], stderr=subprocess.DEVNULL, text=True)
                  break
              except subprocess.CalledProcessError:
                  if time.monotonic() >= deadline:
                      raise RuntimeError("Fixture host key is unavailable") from None
                  time.sleep(0.25)
          known = pathlib.Path(os.environ["RUNNER_TEMP"]) / "connector-known-hosts"
          known.write_text("[127.0.0.1]:2222 " + " ".join(public.split()[:2]) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GRAPHLAYER_TEST_KNOWN_HOSTS=" + str(known) + "\n")
          PY
      - name: Start real investigation application
        run: |
          go -C platform build -trimpath -o "$RUNNER_TEMP/graphlayer-investigate" ./cmd/graphlayer-investigate
          "$RUNNER_TEMP/graphlayer-investigate" --listen 127.0.0.1:8091 --data-dir "$RUNNER_TEMP/acquisition-workspace" > "$RUNNER_TEMP/acquisition-app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/acquisition-app.pid"
      - name: Acquire SFTP and SMB configurations and investigate with source evidence
        run: python e2e/connector-acquisition.py
      - name: Stop fixture processes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/acquisition-app.pid" ]; then kill "$(cat "$RUNNER_TEMP/acquisition-app.pid")" || true; fi
          docker rm --force graphlayer-connector-fixture || true

  windows-native-go:
    # Private validation is local and must not start paid hosted Windows work.
    # Resume the native check when public hosted CI is available again.
    if: github.event.repository.private != true || vars.GRAPHLAYER_ONPREM_RUNNERS != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Prepare matching application and Rust worker version resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @(Select-String -LiteralPath 'crates/graphlayer-engine/Cargo.toml' -Pattern '^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if ($versions.Count -ne 1) { throw 'The worker must declare one X.Y.Z package version.' }
          $version = $versions[0].Matches[0].Groups[1].Value
          $rc = Get-ChildItem -LiteralPath 'C:/Program Files (x86)/Windows Kits/10/bin' -Filter rc.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $cvtres = Get-ChildItem -LiteralPath 'C:/Program Files/Microsoft Visual Studio' -Filter cvtres.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\cvtres\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $rc -or -not $cvtres) { throw 'Microsoft resource compiler tools are required.' }
          $resources = Join-Path $env:RUNNER_TEMP 'graphlayer-ci-version-resources'
          ./scripts/windows/New-GraphLayerVersionResources.ps1 -Version $version -RcPath $rc -CvtresPath $cvtres -OutputDirectory $resources
          Copy-Item -LiteralPath (Join-Path $resources 'graphlayer-investigate.syso') -Destination platform/cmd/graphlayer-investigate/graphlayer-version.syso
          "GRAPHLAYER_VERSION_RESOURCE=$(Join-Path $resources 'graphlayer-engine.res')" >> $env:GITHUB_ENV
          "GRAPHLAYER_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "GRAPHLAYER_RC_PATH=$rc" >> $env:GITHUB_ENV
          "GRAPHLAYER_CVTRES_PATH=$cvtres" >> $env:GITHUB_ENV

      - uses: ./.github/actions/build-rust-engine

      - name: Verify actual Rust worker and application PE resource contracts
        shell: pwsh
        run: |
          ./tests/windows-version-resources.Tests.ps1 -RcPath $env:GRAPHLAYER_RC_PATH -CvtresPath $env:GRAPHLAYER_CVTRES_PATH -RustWorkerPath $env:GRAPHLAYER_ENGINE -Version $env:GRAPHLAYER_PACKAGE_VERSION
          ./tests/windows-signing-input.Tests.ps1

      - name: Test native Rust filesystem and worker contracts
        run: cargo test --locked --release --workspace --lib --bins

      - name: Test native vendor parsers and investigation storage
        working-directory: platform
        run: go test ./vendors/cisco/asa ./firewall ./policy ./investigation ./cmd/graphlayer-investigate ./pathanalysis ./networkpath ./rustengine

      - name: Verify Windows package signing contracts
        shell: pwsh
        run: |
          $signTool = Get-ChildItem -LiteralPath 'C:/Program Files (x86)/Windows Kits/10/bin' -Filter signtool.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'The Microsoft Windows SDK SignTool is required.' }
          ./tests/windows-package.Tests.ps1 -SignToolPath $signTool

      - name: Package explicitly unsigned Windows development application and Rust worker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native-input | Out-Null
          go -C platform build -trimpath -o ../native-input/graphlayer-investigate.exe ./cmd/graphlayer-investigate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $env:GRAPHLAYER_ENGINE -Destination native-input/graphlayer-engine.exe
          ./tests/windows-signing-input.Tests.ps1 -ReleaseInputDirectory native-input -Version $env:GRAPHLAYER_PACKAGE_VERSION
          ./scripts/windows/New-GraphLayerWindowsPackage.ps1 -InputDirectory native-input -OutputDirectory native-bundle -PackageKind Development -SourceRevision (git rev-parse HEAD)
          ./scripts/windows/Test-GraphLayerWindowsPackage.ps1 -PackageDirectory native-bundle
          ./scripts/windows/Test-GraphLayerWorker.ps1 -PackageDirectory native-bundle -PackageKind Development
      - name: Upload explicitly unsigned development bundle
        uses: ./.github/actions/archive-ci-artifact
        with:
          name: graphlayer-investigate-windows-amd64-development
          path: native-bundle/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test packaged Windows application and sibling Rust worker
        shell: pwsh
        run: |
          $env:GRAPHLAYER_ENGINE = $null
          $smokeData = Join-Path $env:RUNNER_TEMP 'graphlayer-native-smoke'
          $smokeOut = Join-Path $env:RUNNER_TEMP 'graphlayer-native-smoke.stdout'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'graphlayer-native-smoke.stderr'
          $smokeApp = (Resolve-Path 'native-bundle/graphlayer-investigate.exe').Path
          $smokeProcess = Start-Process -FilePath $smokeApp -ArgumentList @('--listen', '127.0.0.1:8091', '--data-dir', ('"{0}"' -f $smokeData)) -WindowStyle Hidden -PassThru -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          try {
            python e2e/container-smoke.py
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application smoke test failed' }
          } finally {
            if (-not $smokeProcess.HasExited) { Stop-Process -Id $smokeProcess.Id -ErrorAction SilentlyContinue }
          }
