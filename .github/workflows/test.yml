name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: Run tests with coverage
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -coverprofile=coverage.out -coverpkg=./correlation/...,./comparison/...,./graph/...,./intelligence/...,./scoring/...,./vendors/shared/...,./models/...,./reference/iana/...,./policy/...,./cmd/graphlayer-policy/...,./vendors/cisco/asa/...,./firewall/...,./investigation/...,./cmd/graphlayer-investigate/...,./pathanalysis/... \
            ./correlation/... ./comparison/... ./graph/... \
            ./intelligence/... ./scoring/... ./vendors/shared/... \
            ./models/... ./reference/iana/... ./policy/... ./cmd/graphlayer-policy/... \
            ./vendors/cisco/asa/... ./firewall/... ./investigation/... ./cmd/graphlayer-investigate/... ./pathanalysis/...

      - name: Check policy and investigation concurrency
        working-directory: platform
        run: go test -race ./policy ./firewall ./investigation ./pathanalysis

      - name: Coverage threshold check
        run: |
          cd platform
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COV}%"
          if (( $(echo "$COV < 70.0" | bc -l) )); then
            echo "Coverage ${COV}% below 70% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: platform/coverage.out

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python connector tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -v

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real ASA browser workflow
        run: npm run test:e2e

      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firewall-investigation-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-native-go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: Test native ASA parser and investigation storage
        working-directory: platform
        run: go test ./vendors/cisco/asa ./firewall ./policy ./investigation ./cmd/graphlayer-investigate ./pathanalysis
