name: Rust engine and architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          if cargo fmt --all -- --check; then exit 0; fi
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
          exit 1
      - name: Upload formatting correction for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-correction
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
      - name: Check Rust engine
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust engine
        run: cargo test --locked --workspace
      - uses: ./.github/actions/build-rust-engine

      - name: Measure bounded 1000-host layer projections
        env:
          GRAPHLAYER_SCALE_ARTIFACT_DIR: ${{ runner.temp }}/topology-scale
        run: cargo test --locked --release -p graphlayer-engine --test topology_layers_scale -- --nocapture
      - name: Upload synthetic scale corpus and measurements
        uses: actions/upload-artifact@v4
        with:
          name: topology-scale-corpus
          path: ${{ runner.temp }}/topology-scale/

  rust-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Rust implementation ownership
        run: python scripts/check-rust-boundary.py
      - name: Test boundary ratchet
        run: python -m unittest tests.test_rust_boundary -v

  rust-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build packaged investigation application
        run: docker build --file Dockerfile.investigate --tag graphlayer-investigate:ci .
      - name: Start packaged loopback application
        run: docker run --detach --network host --name graphlayer-rust-smoke graphlayer-investigate:ci --listen 127.0.0.1:8091 --data-dir /tmp/graphlayer-smoke
      - name: Import ASA through the packaged Rust sibling
        run: python e2e/container-smoke.py
      - name: Stop packaged application
        if: always()
        run: docker rm --force graphlayer-rust-smoke || true
