name: Lint

on:
  push:
    branches: [main, codex/repository-privacy]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-supported:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: Vet supported contract packages
        working-directory: platform
        # Legacy vendor packages are excluded until their independent module
        # and build failures are resolved; this is not a repository-wide lint.
        run: go vet ./correlation/... ./comparison/... ./graph/... ./intelligence/... ./scoring/... ./vendors/shared/... ./models/... ./reference/iana/... ./policy/... ./cmd/graphlayer-policy/... ./vendors/cisco/asa/... ./firewall/... ./investigation/... ./cmd/graphlayer-investigate/... ./pathanalysis/... ./networkpath/...

  fuzz:
    runs-on: ${{ github.event_name == 'push' && github.event.repository.private == true && github.repository == 'mattpainter701/graphlayer' && vars.GRAPHLAYER_ONPREM_RUNNERS == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/repository-privacy') && fromJSON('["self-hosted","Linux","X64","graphlayer-private"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: Fuzz correlation deduplication
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -fuzz='^FuzzDedupBySerial$' -fuzztime=30s \
            ./correlation/
