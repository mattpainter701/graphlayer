name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: platform
          args: --timeout=5m

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Fuzz parsers
        run: |
          cd platform
          TMPDIR=${RUNNER_TEMP} go test -fuzz=. -fuzztime=30s \
            ./vendors/... 2>&1 | tee fuzz.log
          if grep -q "FAIL" fuzz.log; then exit 1; fi
